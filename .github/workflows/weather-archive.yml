name: 기상 원자료 자동 적재

# UTC 22시 = KST 아침 7시(KMA 단기예보 05시 발표분 수신 가능 시점 이후).
# idle_forecast.json 은 절대 커밋하지 않는다 — 시연 수치(42인일)를 고정하기 위함.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests pandas python-dotenv

      - name: Fetch KMA + archive snapshot
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: |
          python forecast/kma_api.py
          # idle.py 는 weekly_rain.csv 재생성 이후의 메타 필드 갱신용(=generated_at, source)이지만
          # 결과 JSON 은 커밋 대상이 아니므로 실패해도 적재는 유지되게 || true.
          python forecast/idle.py || echo "⚠ idle.py 생략(적재는 유지)"

      - name: Commit snapshot if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 적재 대상만 add (idle_forecast.json 자동 제외). 파일명이 YYYY-MM-DD_HHMM.csv 로
          # 바뀌어 같은 날 재실행에도 이전 스냅샷을 덮지 않는다 (QA-40).
          git add data/weather_history/*.csv data/weekly_rain.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          git commit -m "chore(data): 기상 원자료 적재 $TODAY"
          git push
